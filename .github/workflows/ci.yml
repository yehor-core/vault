name: CI

# The same gates as the pre-commit hook, on a clean machine: the hook is silent in a worktree where
# `npx husky` has not run, so a commit can reach a pull request without any of them.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run check:refs
      - run: npm test
